[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flutter-calc"
version = "0.1.0"
description = "Rayleigh-Ritz + doublet-lattice flutter calculator for cantilever wings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yuhei Hattori" }]
keywords = ["aeroelasticity", "flutter", "aerodynamics", "doublet-lattice", "rayleigh-ritz"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dlm = ["panel-aero"]        # doublet-lattice backend (DLR PanelAero)
dev = ["pytest>=7"]
docs = ["reportlab>=4"]     # regenerate the PDF guides

[project.urls]
Homepage = "https://github.com/yihattori/flutter_calculator"
Issues = "https://github.com/yihattori/flutter_calculator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
